<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Create User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Create User</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/users}" th:object="${user}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" th:field="*{name}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Extension</label>
                        <div id="extensionRows">
                            <div class="row extension-row mb-2 g-2">
                                <div class="col-5">
                                    <select name="extensions[0].type" class="form-select ext-type-select"
                                        onchange="toggleCustomExtType(this)">
                                        <option value="">-- Pilih Tipe --</option>
                                        <option th:each="t : ${extensionTypes}" th:value="${t}" th:text="${t}"></option>
                                        <option value="__custom__">+ Tipe baru...</option>
                                    </select>
                                    <input type="text" class="form-control mt-1 ext-type-custom d-none"
                                        oninput="commitCustomExtType(this)" placeholder="Nama tipe baru">
                                </div>
                                <div class="col-5">
                                    <input type="text" name="extensions[0].number" class="form-control ext-number"
                                        placeholder="Nomor extension">
                                </div>
                                <div class="col-2">
                                    <button type="button"
                                        class="btn btn-outline-danger btn-sm remove-extension">Hapus</button>
                                </div>
                            </div>
                        </div>
                        <button type="button" id="addExtensionBtn" class="btn btn-outline-primary btn-sm mt-1">+ Tambah
                            Extension</button>
                    </div>
                    <script th:inline="javascript">
                        /*<![CDATA[*/
                        const KNOWN_EXT_TYPES = /*[[${extensionTypes}]]*/[];
                        /*]]>*/

                        function buildTypeOptionsHtml() {
                            let html = '<option value="">-- Pilih Tipe --</option>';
                            KNOWN_EXT_TYPES.forEach(function (t) {
                                html += '<option value="' + t + '">' + t + '</option>';
                            });
                            html += '<option value="__custom__">+ Tipe baru...</option>';
                            return html;
                        }

                        function toggleCustomExtType(selectEl) {
                            const row = selectEl.closest(".extension-row");
                            const customInput = row.querySelector(".ext-type-custom");
                            if (selectEl.value === "__custom__") {
                                customInput.classList.remove("d-none");
                                customInput.value = "";
                                customInput.focus();
                            } else {
                                customInput.classList.add("d-none");
                            }
                        }

                        function commitCustomExtType(customInput) {
                            const row = customInput.closest(".extension-row");
                            const select = row.querySelector(".ext-type-select");
                            const value = customInput.value.trim();
                            if (!value) return;
                            select.querySelectorAll('option[data-custom="true"]').forEach(o => o.remove());
                            const opt = document.createElement("option");
                            opt.value = value;
                            opt.text = value;
                            opt.dataset.custom = "true";
                            opt.selected = true;
                            select.insertBefore(opt, select.querySelector('option[value="__custom__"]'));
                        }

                        (function () {
                            let extIndex = 1;
                            const container = document.getElementById("extensionRows");

                            document.getElementById("addExtensionBtn").addEventListener("click", function () {
                                const row = document.createElement("div");
                                row.className = "row extension-row mb-2 g-2";
                                row.innerHTML =
                                    '<div class="col-5">' +
                                    '  <select name="extensions[' + extIndex + '].type" class="form-select ext-type-select" onchange="toggleCustomExtType(this)">' + buildTypeOptionsHtml() + '</select>' +
                                    '  <input type="text" class="form-control mt-1 ext-type-custom d-none" oninput="commitCustomExtType(this)" placeholder="Nama tipe baru">' +
                                    '</div>' +
                                    '<div class="col-5">' +
                                    '  <input type="text" name="extensions[' + extIndex + '].number" class="form-control ext-number" placeholder="Nomor extension">' +
                                    '</div>' +
                                    '<div class="col-2">' +
                                    '  <button type="button" class="btn btn-outline-danger btn-sm remove-extension">Hapus</button>' +
                                    '</div>';
                                container.appendChild(row);
                                extIndex++;
                            });

                            container.addEventListener("click", function (e) {
                                if (e.target.classList.contains("remove-extension")) {
                                    if (container.querySelectorAll(".extension-row").length > 1) {
                                        e.target.closest(".extension-row").remove();
                                    } else {
                                        const r = e.target.closest(".extension-row");
                                        r.querySelector(".ext-type-select").value = "";
                                        r.querySelector(".ext-type-custom").classList.add("d-none");
                                        r.querySelector(".ext-number").value = "";
                                    }
                                }
                            });
                        })();
                    </script>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Company</label>
                        <select th:field="*{companyId}" class="form-select">
                            <option value="">-- Select Company --</option>
                            <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Subregion</label>
                        <select id="subregion" class="form-select">
                            <option value="">-- Pilih Subregion --</option>
                            <option th:each="sr : ${subregions}" th:value="${sr}" th:text="${sr}">
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Location</label>
                        <select id="location" name="locationId" class="form-select" onchange="updateExtCode(this)">
                            <option value="">-- Pilih Lokasi --</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Kode Area</label>
                        <input type="text" id="extCodeDisplay" class="form-control" readonly
                            placeholder="Otomatis muncul setelah pilih lokasi">
                    </div>

                    <script th:inline="javascript">
                        function updateExtCode(selectEl) {
                            const opt = selectEl.options[selectEl.selectedIndex];
                            const extCode = opt ? opt.getAttribute("data-extcode") : "";
                            document.getElementById("extCodeDisplay").value = extCode || "";
                        }

                        document.getElementById("subregion").addEventListener("change", function () {
                            let subregion = this.value;
                            let locationSelect = document.getElementById("location");

                            locationSelect.innerHTML = '<option value="">-- Pilih Lokasi --</option>';
                            document.getElementById("extCodeDisplay").value = "";

                            if (subregion) {
                                fetch("/users/locations-by-subregion?subregion=" + encodeURIComponent(subregion))
                                    .then(response => response.json())
                                    .then(data => {
                                        data.forEach(loc => {
                                            let opt = document.createElement("option");
                                            opt.value = loc.id;
                                            opt.text = loc.name;
                                            opt.setAttribute("data-extcode", loc.extCode || "");
                                            locationSelect.add(opt);
                                        });
                                    })
                                    .catch(err => console.error("Error fetching locations: ", err));
                            }
                        });
                    </script>

                    <div class="d-flex justify-content-end">
                        <a th:href="@{/users}" class="btn btn-secondary me-2">Cancel</a>
                        <button type="submit" class="btn btn-success">Create</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
