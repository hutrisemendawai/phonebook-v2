spring.application.name=phonebook

spring.datasource.url=jdbc:mysql://localhost:3306/phonebook?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false
server.port=8080
server.forward-headers-strategy=framework
server.error.include-message=always

# Spring Boot DevTools & Auto-Restart saat file disimpan (save)
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=400ms
spring.devtools.livereload.enabled=true

# Migrasi satu-kali: gabungkan user lama yang di-split per jenis extension.
# Set true SEKALI, jalankan, cek log, lalu kembalikan ke false.
app.migrate-extensions=false

# Migrasi satu-kali: hapus tabel departments & kolom users.department_id.
app.remove-department=false

# Migrasi satu-kali: replace seluruh data locations dari src/main/resources/data/locations.csv.
# PENTING: ini akan melepas semua assignment lokasi user yang sudah ada (perlu di-assign ulang manual).
app.reload-locations=false

# Upload Excel untuk import user
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
